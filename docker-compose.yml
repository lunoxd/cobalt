services:
  cobalt-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cobalt-backend
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - ENV=production
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-cobalt}?sslmode=disable
      - DB_MAX_CONNS=25
      - DB_MIN_CONNS=5
      - ADMIN_API_KEY=${ADMIN_API_KEY:-cb_admin_secret_key_change_in_prod}
      - AUTH_PROVIDER=header
      - RATE_LIMIT_RPS=50
      - RATE_LIMIT_BURST=100
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-whsec_cobalt_production_secret}
      - CORS_ALLOWED_ORIGINS=*
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cobalt-network

  postgres:
    image: postgres:16-alpine
    container_name: cobalt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cobalt}
    volumes:
      - cobalt_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cobalt}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cobalt-network

  cobalt-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: cobalt-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - cobalt-backend
    networks:
      - cobalt-network

volumes:
  cobalt_pgdata:
    driver: local

networks:
  cobalt-network:
    driver: bridge
